[project]
name = "orchestra"
version = "0.1.0"
description = "Open-source portal that roots a strong agent and delegates to swappable local or API sub-agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.scripts]
orchestra = "orchestra.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestra", "orchestra.providers", "orchestra.routes"]
